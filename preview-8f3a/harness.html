<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>viewport harness</title>
<style>
  html,body{margin:0;background:#2a2a2e;color:#eee;font:11px ui-monospace,monospace}
  .bar{padding:6px 10px}
  iframe{border:0;display:block;background:#000}
</style>
</head>
<body>
<div class="bar" id="bar">—</div>
<iframe id="frame" src="index.html" width="390" height="844" style="width:390px;height:844px"></iframe>
<script>
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (p) {
    var kv = p.split('='); if (kv[0]) q[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1] || '');
  });
  var w = parseInt(q.w || '390', 10), h = parseInt(q.h || '844', 10), lang = q.lang || 'en';
  var f = document.getElementById('frame');
  f.src = 'index.html?lang=' + lang;
  f.width = w; f.height = h; f.style.width = w + 'px'; f.style.height = h + 'px';
  document.getElementById('bar').textContent = 'width ' + w + ' · lang ' + lang;
</script>
</body>
</html>
