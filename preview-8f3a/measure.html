<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>measure</title>
<style>body{margin:0;background:#111;color:#eee;font:12px ui-monospace,monospace;padding:10px}pre{white-space:pre-wrap}</style>
</head>
<body>
<pre id="out">measuring…</pre>
<script>
const LANGS = ['en','ko','zh','ja','ar','de','fr'];
const WIDTHS = [360, 390];
const rows = [];
function load(lang, w){
  return new Promise(function(resolve){
    const f = document.createElement('iframe');
    f.style.cssText = 'position:fixed;left:-9999px;top:0;width:' + w + 'px;height:900px;border:0';
    f.src = 'index.html?lang=' + lang;
    let done = false;
    const finish = function(){
      if (done) return; done = true;
      try {
        const d = f.contentDocument, win = f.contentWindow;
        const iw = win.innerWidth, sw = d.documentElement.scrollWidth;
        const wide = [];
        const els = d.querySelectorAll('body *');
        for (let i = 0; i < els.length; i++){
          const r = els[i].getBoundingClientRect();
          if (r.right > iw + 1 || r.left < -1){
            wide.push((els[i].className || els[i].tagName) + ' [' + Math.round(r.left) + ',' + Math.round(r.right) + ']');
          }
          if (wide.length > 4) break;
        }
        const nav = d.querySelector('.nav');
        const kpi = d.getElementById('kpiMult');
        const langBar = d.querySelector('.lang-list');
        rows.push({
          lang: lang, w: w, innerWidth: iw, scrollWidth: sw, overflow: sw > iw,
          navScroll: nav ? nav.scrollWidth : null, navW: nav ? Math.round(nav.getBoundingClientRect().width) : null,
          langBarVisible: langBar ? getComputedStyle(langBar).display !== 'none' : null,
          kpiMult: kpi ? (kpi.textContent || '').trim() : 'MISSING',
          dir: d.documentElement.dir,
          wide: wide
        });
      } catch (e) { rows.push({lang: lang, w: w, error: String(e)}); }
      f.remove();
      resolve();
    };
    f.onload = function(){ setTimeout(finish, 600); };
    setTimeout(finish, 9000);
    document.body.appendChild(f);
  });
}
(async function(){
  for (const w of WIDTHS) for (const l of LANGS) await load(l, w);
  document.getElementById('out').textContent = JSON.stringify(rows, null, 1);
})();
</script>
</body>
</html>
