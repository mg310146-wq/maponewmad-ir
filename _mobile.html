<!doctype html>
<html><head><meta charset="utf-8"><title>layout preview</title>
<style>
  body{margin:0;background:#3a3a3a;font:12px/1.4 -apple-system,sans-serif;color:#ddd;display:flex;gap:24px;padding:16px;align-items:flex-start}
  .dev{display:flex;flex-direction:column;gap:8px}
  .dev b{font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:10px}
  iframe{border:0;background:#0a0a0b;display:block}
</style></head>
<body>
  <div class="dev"><b id="lab">390</b><iframe id="fr" style="width:390px;height:15000px"></iframe></div>
  <script>
    var q = new URLSearchParams(location.search);
    var w = q.get('w') || '390';
    var fr = document.getElementById('fr');
    document.getElementById('lab').textContent = w + ' px';
    fr.style.width = w + 'px';
    fr.src = 'index.html' + (q.get('lang') ? '?lang=' + q.get('lang') : '');
  </script>
</body></html>
